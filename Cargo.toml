[package]
name = "metroidvania-map-generator"
version = "0.4.0"
edition = "2024"

[dependencies]
dirs = "7.0.0"
macroquad = "0.4.16"
png = "0.18.1"
resvg = { version = "0.48.1", default-features = false }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[build-dependencies]
winresource = "0.1.34"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
