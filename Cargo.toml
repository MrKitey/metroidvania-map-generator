[package]
name = "metroidvania-map-generator"
version = "0.9.0"
edition = "2024"

[dependencies]
dirs = "7.0.0"
eframe = { version = "0.37.0", features = ["persistence"] }
egui = "0.37.0"
fastrand = "2.5.0"
png = "0.18.1"
resvg = { version = "0.48.1", default-features = false }
raw-window-handle = "0.6.2"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# winit 0.30 does not report dropped files on Wayland. These talk to the compositor directly.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
wayland-client = { version = "0.31.15", features = ["system"] }

[build-dependencies]
winresource = "0.1.34"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
